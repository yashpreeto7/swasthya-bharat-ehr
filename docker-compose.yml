version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: swasthya-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: swasthya_bharat_ehr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d swasthya_bharat_ehr"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: swasthya-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/swasthya_bharat_ehr
      - ENVIRONMENT=production
      - JWT_SECRET_KEY=swasthya_jwt_secret_key_prod_2026
      - CORS_ORIGINS=["http://localhost:3000"]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: swasthya-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:

